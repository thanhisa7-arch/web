<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Get Key</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #1b1b2b;
    border-radius: 16px;
    padding: 40px;
    width: 420px;
    text-align: center;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }
  h2 { margin-bottom: 10px; color: #4caf50; }
  p.sub { color: #999; font-size: 14px; margin-bottom: 25px; }

  .step { display: none; }
  .step.active { display: block; }

  .btn {
    background: #4caf50;
    border: none;
    color: #fff;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.2s;
  }
  .btn:hover { background: #3d9140; }
  .btn:disabled {
    background: #555;
    cursor: not-allowed;
  }

  .progress-wrap {
    background: #333;
    border-radius: 8px;
    height: 10px;
    width: 100%;
    overflow: hidden;
    margin: 15px 0;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: #4caf50;
    transition: width 1s linear;
  }

  .key-box {
    background: #111;
    border: 1px dashed #4caf50;
    border-radius: 8px;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #4caf50;
    margin: 15px 0;
    word-break: break-all;
  }

  .copied {
    font-size: 13px;
    color: #4caf50;
    opacity: 0;
    transition: opacity 0.3s;
  }
</style>
</head>
<body>

<div class="card">

  <!-- STEP 1: nút bắt đầu -->
  <div class="step active" id="step1">
    <h2>🔑 Lấy Key</h2>
    <p class="sub">Nhấn nút bên dưới để bắt đầu lấy key</p>
    <button class="btn" onclick="startWait()">Bắt đầu</button>
  </div>

  <!-- STEP 2: chờ / đếm ngược (giả lập qua ads / timer) -->
  <div class="step" id="step2">
    <h2>⏳ Đang xử lý...</h2>
    <p class="sub">Vui lòng chờ <span id="countdown">15</span> giây</p>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- STEP 3: hiện key -->
  <div class="step" id="step3">
    <h2>✅ Key của bạn</h2>
    <div class="key-box" id="keyText">—</div>
    <button class="btn" onclick="copyKey()">Copy Key</button>
    <div class="copied" id="copiedMsg">Đã copy!</div>
  </div>

</div>

<script>
const WAIT_TIME = 15; // giây, chỉnh theo ý muốn

function generateKey() {
  // sinh key ngẫu nhiên dạng XXXX-XXXX-XXXX-XXXX
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let parts = [];
  for (let p = 0; p < 4; p++) {
    let seg = '';
    for (let i = 0; i < 4; i++) seg += chars[Math.floor(Math.random() * chars.length)];
    parts.push(seg);
  }
  return parts.join('-');
}

function switchStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startWait() {
  switchStep('step2');
  let timeLeft = WAIT_TIME;
  const countdownEl = document.getElementById('countdown');
  const bar = document.getElementById('progressBar');

  const interval = setInterval(() => {
    timeLeft--;
    countdownEl.textContent = timeLeft;
    bar.style.width = ((WAIT_TIME - timeLeft) / WAIT_TIME * 100) + '%';

    if (timeLeft <= 0) {
      clearInterval(interval);
      const key = generateKey();
      document.getElementById('keyText').textContent = key;
      switchStep('step3');
    }
  }, 1000);
}

function copyKey() {
  const key = document.getElementById('keyText').textContent;
  navigator.clipboard.writeText(key).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.opacity = 1;
    setTimeout(() => msg.style.opacity = 0, 1500);
  });
}
</script>

</body>
</html>
